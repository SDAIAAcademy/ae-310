t":null,"explanation":"Both models fail, so capability is not the cause. The table is a fact the models were never given, and it changes: it belongs in the context.","misconceptions":["Treats a missing fact as a missing skill: no example set makes the model know a table that changes every year","Assumes capability is the problem, although the larger model fails in the same way","","Fixes the form of an answer whose form is already valid: the schema cannot supply the right code"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-failure-class","title":"Which lever?"},"level":null,"pool":"checkpoint"},{"id":"check-baseline-q1","type":"single","prompt":"A colleague reports: \"Our adapter scores 84 on the 100 requests; the prompted model scored 27.\" The 27 is version 0. What does the report show?","options":[{"key":"A","text":"Less than it claims: the adapter must be compared with the frozen baseline, 67"},{"key":"B","text":"That tuning gained 57 points"},{"key":"C","text":"Nothing, because 100 requests are too few to measure anything"},{"key":"D","text":"That the adapter should be compared with the larger model only"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The baseline is the best prompt on the same model. Against 67 the gain is 17 points, still to be tested as a paired difference on the test set.","misconceptions":["","Takes the largest available difference as the effect of tuning, although 40 of those points came from words","Rejects a valid measurement for the wrong reason: 100 requests give a wide interval, but the comparison is what is wrong","Confuses the instrument with the product: the larger model is not a deployable option for the chamber"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-baseline","title":"Better than what?"},"level":null,"pool":"checkpoint"},{"id":"check-licence-q1","type":"single","prompt":"A model's licence allows commercial use only to organisations with annual revenue under USD 10 million. The chamber's revenue is above that, and its registration service charges fees. What goes in the \"deploy\" column?","options":[{"key":"A","text":"Yes: the weights are open, so use is free"},{"key":"B","text":"Yes: a chamber is a non-profit body, so the limit cannot apply"},{"key":"C","text":"Yes, once the model is fine-tuned, because the adapter is ours"},{"key":"D","text":"Ask: counsel must decide whether a fee-charging service is commercial use"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The clause depends on a fact (above the threshold) and on a judgement (is the use commercial?). The engineer records both; counsel answers.","misconceptions":["Reads the download as the permission: the weights are public, the right to use them commercially is conditional","Assumes a non-profit body can never make commercial use, which the licence's own definition does not say","Moves the problem instead of answering it: tuning makes a derivative work under the same licence",""],"lo":["LO6"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-licence","title":"May we deploy it?"},"level":null,"pool":"checkpoint"},{"id":"check-cost-q1","type":"single","prompt":"The chamber's requests double to 80,000 a month. The accelerator still has spare capacity. What happens to the cost per thousand requests?","options":[{"key":"A","text":"Both options stay the same"},{"key":"B","text":"Hosted stays the same; the owned accelerator's halves"},{"key":"C","text":"Hosted halves; the owned accelerator's stays the same"},{"key":"D","text":"Both double"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A per-token price does not depend on volume. A fixed monthly cost divided by twice the requests is half the cost per request.","misconceptions":["Applies the shape of a per-token price to a machine whose cost is fixed","","Assumes a volume discount that a published per-token price does not contain","Treats a fixed monthly cost as if it grew with use"],"lo":["LO6"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-cost","title":"The volume doubles"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"With the frozen instructions, Qayd still takes a partner company's registration number in some requests. The code table and the schema are in the prompt. Which examples must today's tuning set contain?","options":[{"key":"A","text":"More rows of the activity code table"},{"key":"B","text":"Requests with two registration numbers, labelled with the applicant's own"},{"key":"C","text":"More requests that Qayd already answers correctly"},{"key":"D","text":"Examples of well-formed JSON"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A behaviour failure is fixed by examples of the right decision in the situation where the model decides wrongly. Data for tuning is chosen by failure class.","misconceptions":["Adds knowledge the prompt already holds: the failure is a decision, not a missing fact","","Repeats what the model already does right, which teaches the format again and the decision never","Fixes the form of a call whose form is already valid"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Which failures does today's data have to fix?"},"level":null,"pool":"checkpoint"},{"id":"check-traces-q1","type":"single","prompt":"A corrected trace has the desk's call {\"name\": \"update_record\", \"arguments\": {\"cr_number\": \"4031582699\", \"field\": \"city\", \"value\": \"الدمام\"}}. The interface lists cities in English. What do you do with it?","options":[{"key":"A","text":"Keep it: a human correction is always right"},{"key":"B","text":"Change the value to \"Dammam\" and keep it as a correction"},{"key":"C","text":"Drop it and count it, or send it back to the desk"},{"key":"D","text":"Replace it with Qayd's original output"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The registry would reject the call, so it is not a usable label. Whatever you do with it must be visible in the counts.","misconceptions":["Trusts a person's label over the tool it must call: the model would learn a value the registry refuses","Puts your own guess into the set under the desk's name, with no record of the change","","Uses the model's wrong answer as a training target"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-traces","title":"Which rows enter the tuning set?"},"level":null,"pool":"checkpoint"},{"id":"check-verifier-q1","type":"single","prompt":"A teacher labelled 1,000 requests. Schema and rule checks kept 960. Nobody has read any of them. What can you state about the 960?","options":[{"key":"A","text":"They are 96% accurate"},{"key":"B","text":"They contain no errors, because the bad ones were rejected"},{"key":"C","text":"They cannot be used until every one is read by staff"},{"key":"D","text":"They are valid and consistent with their requests; their error rate is unknown until a sample is audited"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A verifier removes what it can detect. The rate of what it cannot detect is measured by people, on a sample, with an interval.","misconceptions":["Reads yield as accuracy: passing the checks says the labels are well-formed and consistent, not right","Assumes the checks see every error, although a valid, consistent call can be the wrong decision","Discards labels that are mostly right for lack of a measurement that an audit can supply",""],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-verifier","title":"What did the verifier prove?"},"level":null,"pool":"checkpoint"},{"id":"check-template-q1","type":"single","prompt":"A freshly tuned adapter produces the correct tool call and then continues with more calls and stray text until the token limit. The base model never did this. Where do you look first?","options":[{"key":"A","text":"The rendered training text: is there an end-of-turn token after the assistant's answer?"},{"key":"B","text":"The learning rate: it was too high"},{"key":"C","text":"The server: raise the stop-token limit"},{"key":"D","text":"The tuning set: it needs more examples"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A model stops because it was shown stopping. If the training text never ends the turn, no setting teaches it to.","misconceptions":["","Treats a formatting fault as an optimisation problem: a lower rate would learn the same wrong text more slowly","Hides the symptom at serving time and pays for the extra tokens on every request","Blames quantity for a fault that every example shares"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-template","title":"It answers, and then it keeps writing"},"level":null,"pool":"checkpoint"},{"id":"check-overlap-q1","type":"single","prompt":"Your overlap check flags a tuning row: \"We want to renew for two years. Thank you.\" The same sentence is in the test set. Neither names a company or a number. What goes in the report?","options":[{"key":"A","text":"A leak: remove it, and remove every row like it"},{"key":"B","text":"A template collision: keep it, and report how many there are"},{"key":"C","text":"Nothing: generic sentences need no mention"},{"key":"D","text":"Remove the sentence from the test set instead"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The row carries no member's content and is how members really write. It stays, and the count goes in the report so that the reader can judge the test.","misconceptions":["Treats any shared text as a leak and would delete every short, common request from training","","Hides a fact that a reader of the report needs to judge the test","Changes the test set after the fact, which breaks every comparison already made on it"],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-overlap","title":"Leak or not?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"You are about to train on 661 examples. Which check from yesterday can no longer be made once the run has finished and the loss has fallen?","options":[{"key":"A","text":"That the tuned model beats the base on the test set"},{"key":"B","text":"That the validation loss fell"},{"key":"C","text":"That the rendered text ends the turn and matches the model's template"},{"key":"D","text":"That the adapter has the intended rank"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A wrong rendering trains without complaint: the loss falls on whatever text it is given. It can be checked afterwards, but by then the run has been paid for.","misconceptions":["Can still be made afterwards: the test set is opened on Day 4","A property of the run, read from its log after it ends","","Read from the adapter's configuration at any time"],"lo":["LO2"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"What must be true of the text before the first training step?"},"level":null,"pool":"checkpoint"},{"id":"check-adapter-q1","type":"single","prompt":"A base has 24 layers. You put a rank-8 adapter on the query and value projections of each layer; each is a 1,024 × 1,024 matrix. How many parameters train?","options":[{"key":"A","text":"16,384"},{"key":"B","text":"32,768"},{"key":"C","text":"786,432"},{"key":"D","text":"50,331,648"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Each adapted matrix adds r × (d_in + d_out) = 8 × 2,048 = 16,384. There are 2 × 24 = 48 of them: 48 × 16,384 = 786,432.","misconceptions":["Counts one matrix of one layer: 8 × (1,024 + 1,024)","Counts both matrices of a layer but forgets there are 24 layers","","Counts the full matrices, which are frozen: 48 × 1,024 × 1,024"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-adapter","title":"How many parameters train?"},"level":null,"pool":"checkpoint"},{"id":"check-memory-q1","type":"single","prompt":"An accelerator has 16 GB of memory. You want to train an adapter on a base with 7 billion parameters. What does the arithmetic say?","options":[{"key":"A","text":"Load it in 16 bits: 13 GB of weights fit in 16 GB"},{"key":"B","text":"Load it in 4 bits: about 3.5 GB of weights, leaving room for activations"},{"key":"C","text":"Either: only the adapter needs memory, and it is tiny"},{"key":"D","text":"It cannot be done on this accelerator"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Weights are the floor. Training needs headroom for activations, which grow with batch size and sequence length; 4 bits leaves it, 16 bits does not.","misconceptions":["13 GB of weights leave about 3 GB for activations of every token in the batch: too little for training","","Confuses the adapter's size with the base's: the base must still be in memory to compute anything","Ignores quantisation: 3.5 GB of weights is well inside 16 GB"],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-memory","title":"Will it fit?"},"level":null,"pool":"checkpoint"},{"id":"check-sweep-q1","type":"single","prompt":"On 120 validation requests: rank 8 scores 101, rank 32 scores 102, rank 64 scores 100. Each is one run. Which do you choose, and on what ground?","options":[{"key":"A","text":"Rank 8: the three cannot be told apart, and it is the cheapest"},{"key":"B","text":"Rank 32: it has the highest score"},{"key":"C","text":"Rank 64: more capacity is safer"},{"key":"D","text":"Whichever scores best on the test set"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Differences of one or two requests are inside the noise of a single run. Among runs that cannot be told apart, take the cheapest, and say so.","misconceptions":["","Reads a difference of one request in 120 as real, and pays four times the parameters for it","Assumes capacity is quality, against the scores in front of you","Uses the test set to choose, which spends it"],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-sweep","title":"Which run do you ship?"},"level":null,"pool":"checkpoint"},{"id":"check-distil-q1","type":"single","prompt":"A distilled student takes the partner company's registration number in requests that name two. An audit shows the teacher does the same in about one such request in five. What do you change first?","options":[{"key":"A","text":"Train the student for more steps"},{"key":"B","text":"Raise the adapter's rank"},{"key":"C","text":"Lower the sampling temperature of the student"},{"key":"D","text":"The data: correct or remove those teacher labels, or add staff corrections for that kind of request"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The student learnt what it was shown. A systematic error in the labels is fixed in the labels; no training setting removes it.","misconceptions":["Fits the same wrong labels more closely","Adds capacity to learn the same wrong labels","Changes how the student writes, not what it was taught to decide",""],"lo":["LO3"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-distil","title":"Where do you fix it?"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"Yesterday you chose a rank and a learning rate. A colleague suggests checking the three best settings on the test set this morning and shipping the winner. What is wrong with that?","options":[{"key":"A","text":"The test set is too small to compare three settings"},{"key":"B","text":"The winner's test score would then be a score it was selected on, not an estimate for new requests"},{"key":"C","text":"Evaluating three adapters changes their weights"},{"key":"D","text":"It takes too long"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Choosing is fitting. The setting was chosen on validation requests; the test set is opened once, to report the model that was already chosen.","misconceptions":["The size of the test set is not the problem: 400 requests is more than validation had","","Nothing in the adapters changes by being evaluated","Speed is not the issue; the meaning of the result is"],"lo":["LO3"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"What may the test set be used for?"},"level":null,"pool":"checkpoint"},{"id":"check-paired-q1","type":"single","prompt":"On 400 held-out requests a tuned model scores 352 and a larger prompted model 360. The tuned model alone is right on 18 requests, the larger alone on 26. The paired interval for the difference is −5.3 to +1.3 points. What do you write?","options":[{"key":"A","text":"The larger model is better by 2 points"},{"key":"B","text":"The two models are equally good"},{"key":"C","text":"No difference is shown on this test set; the interval runs from 5.3 points worse to 1.3 better"},{"key":"D","text":"The test is inconclusive and should not be reported"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"An interval that contains zero supports no ranking. It does bound how much worse the tuned model can be: the owner needs that bound.","misconceptions":["Reads the two totals without the interval, which contains zero","Turns 'no difference shown' into 'no difference exists': the interval allows up to 5 points","","Discards a useful bound on the difference"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-paired","title":"Which claim does the evidence support?"},"level":null,"pool":"checkpoint"},{"id":"check-regression-q1","type":"single","prompt":"A tuned model gains 30 points on its task. On a general check it holds its score on four tasks and falls from 40 of 40 to 12 of 40 on translation. The overall general score falls by 14%. What goes in the model card?","options":[{"key":"A","text":"The regression by task: translation fell from 40 to 12 of 40; the other four held"},{"key":"B","text":"\"General abilities: −14%\""},{"key":"C","text":"Only the task gain: the model is for the task"},{"key":"D","text":"\"No other abilities were affected\""}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A reader who depends on translation needs that line. An average is true and useless here; \"no other abilities\" claims more than was measured.","misconceptions":["","Hides one collapsed ability behind an average of five","Leaves out a finding a user of the model needs, because the task score is good","Draws a conclusion the check cannot support: untested abilities are unmeasured"],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-regression","title":"What do you report?"},"level":null,"pool":"checkpoint"},{"id":"check-serving-q1","type":"single","prompt":"A load test gives: 4 in flight, 20 requests/s, p95 300 ms; 16 in flight, 55 requests/s, p95 900 ms; 64 in flight, 70 requests/s, p95 3,400 ms. The service must answer 95% of requests within one second. What capacity do you plan with?","options":[{"key":"A","text":"70 requests a second"},{"key":"B","text":"55 requests a second"},{"key":"C","text":"20 requests a second"},{"key":"D","text":"About 48 requests a second, the mean of the three"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Capacity is the highest throughput whose latency still meets the target: 16 in flight, 55 a second, p95 of 900 ms.","misconceptions":["Takes the highest throughput and ignores that one answer in twenty then takes over three seconds","","Takes the lowest latency although a higher level still meets the target","Averages levels that are separate measurements"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-serving","title":"What is the capacity?"},"level":null,"pool":"checkpoint"},{"id":"check-memo-q1","type":"single","prompt":"A tuned small model is 3 points below a hosted larger model (interval −6 to 0). Its licence allows the use. The requests are Restricted and may not leave the organisation. Tuning removed a refusal behaviour; a replay adapter restores it at no measured cost.","options":[{"key":"A","text":"Use the hosted model: it is better and cheaper"},{"key":"B","text":"Ship the tuned model as it is: 3 points is small"},{"key":"C","text":"Ship the replay adapter, gate releases on the refusal check, state the premium paid for placement"},{"key":"D","text":"Do not ship until it matches the larger model"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Placement rules the hosted model out; the regression has a measured remedy; the gap is a price the owner accepts or refuses.","misconceptions":["Ignores a requirement the hosted model does not meet","Ships a known regression with a tested remedy","","Stops a project whose open issue has a measured fix"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-memo","title":"What does the memo recommend?"},"level":null,"pool":"checkpoint"},{"id":"q-levers-01","type":"single","prompt":"A prompted model answers customers politely and in the right format, but quotes a renewal fee that was correct last year. Which change addresses the cause?","options":[{"key":"A","text":"Fine-tune it on this year's conversations"},{"key":"B","text":"Give it the current fee table in the context"},{"key":"C","text":"Lower the sampling temperature until the fee is stable"},{"key":"D","text":"Distil a larger model's answers into it"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The fee is a fact that changes; a fact belongs in the context, where it can be updated and dated.","misconceptions":["Puts a changing fact into weights, where it will be wrong again next year","","Treats a wrong fact as randomness in generation","Copies the larger model's behaviour, which does not contain this year's fee either"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"behaviour-not-knowledge","title":"Tuning changes behaviour more than knowledge"},"level":"apply","pool":"practice"},{"id":"q-levers-02","type":"single","prompt":"On 100 requests a small model makes 30 behaviour failures and a larger model, with the same instructions, makes 4. What does the pair of counts support?","options":[{"key":"A","text":"Tuning or distillation can teach it to the small model"},{"key":"B","text":"The requests are too hard for any model"},{"key":"C","text":"The small model lacks a fact that must be retrieved each time"},{"key":"D","text":"The grading code is wrong for the small model"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The larger model shows that the right behaviour exists for these requests; the gap is what tuning or distillation can aim at.","misconceptions":["","Ignores that the larger model handles the same requests","Confuses a wrong decision with a missing fact: a missing fact would fail on both models","Blames the instrument without evidence: both models were graded by the same code"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"class-to-lever","title":"The decision table assigns each class to a lever, with counts"},"level":"analyze","pool":"practice"},{"id":"q-levers-03","type":"single","prompt":"A model's answer is the correct tool call, written inside a Markdown code fence instead of the required tags, and the parser rejects it. Which failure class is it?","options":[{"key":"A","text":"Not a failure, because the decision is right"},{"key":"B","text":"Knowledge"},{"key":"C","text":"Behaviour"},{"key":"D","text":"Format"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The decision is right and its wrapping is wrong: a schema hint, an example or tuning on the format fixes it.","misconceptions":["Forgets that the registry only accepts what parses","Sees a rejected call and assumes a missing fact","Calls every wrong answer a wrong decision, although the tool and arguments are right",""],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"three-failure-classes","title":"Three classes, because three different levers fix them"},"level":"apply","pool":"practice"},{"id":"q-levers-04","type":"single","prompt":"Which task is the best candidate for a tuned small model on one accelerator?","options":[{"key":"A","text":"Planning a company's tax filing across several systems"},{"key":"B","text":"Answering any question about commercial law"},{"key":"C","text":"Extracting the same eight fields from thousands of similar forms"},{"key":"D","text":"Reviewing rare contracts that each need a lawyer's judgement"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"One input, one structured output that a program can check, at volume: the narrow shape a small tuned model suits.","misconceptions":["Chooses multi-step work that depends on intermediate results","Chooses an open-ended knowledge task, which tuning teaches badly","","Chooses rare inputs that each need judgement nobody can label at volume"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"narrow-tasks","title":"Small models suit narrow tasks, not multi-step work"},"level":"evaluate","pool":"practice"},{"id":"q-baseline-01","type":"single","prompt":"A team reports that fine-tuning raised accuracy from 31% to 82%. The 31% used a one-sentence prompt. What should a reviewer ask for first?","options":[{"key":"A","text":"A comparison with a model twice the size, tuned alike"},{"key":"B","text":"The score of the best prompt on the same model"},{"key":"C","text":"A larger training set"},{"key":"D","text":"The training loss curve"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Until the untuned model has been given a strong prompt, nobody knows how much of the gain needed training.","misconceptions":["Changes the question from \"did tuning help this model\" to \"which model is bigger\"","","Asks for more of the thing whose effect is not yet established","Checks that training ran, not what it should be compared with"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"weak-baseline-flatters","title":"A weak prompt flatters tuning"},"level":"evaluate","pool":"practice"},{"id":"q-baseline-02","type":"single","prompt":"Two prompt versions score 50 and 52 right out of the same 100 requests. Which statement is supported?","options":[{"key":"A","text":"The versions cannot be told apart on this evidence"},{"key":"B","text":"Version two would score 52% on any hundred requests"},{"key":"C","text":"One hundred requests prove nothing about either"},{"key":"D","text":"Version two is better by two points"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A difference of two requests in 100 is far inside the sampling noise of each score.","misconceptions":["","Treats a sample score as a property of the model","Throws away a measurement that does bound each score to about ten points either way","Reads a difference without asking how large the noise is"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"interval-on-100","title":"A score on 100 requests carries an interval of about ±10 points"},"level":"apply","pool":"practice"},{"id":"q-baseline-03","type":"single","prompt":"After the baseline was frozen, an engineer improves one sentence of the instructions and keeps quoting the old score. What is wrong?","options":[{"key":"A","text":"The set must be changed as well"},{"key":"B","text":"The score should be averaged with the new one, weighted by date"},{"key":"C","text":"Nothing: one sentence cannot change a score"},{"key":"D","text":"The old score belongs to a text no longer in use"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A baseline is a text, a set and a score together; when the text changes, the pairing is broken.","misconceptions":["Changes the second fixed element too, losing every earlier comparison","Mixes two different systems into one number","Assumes small edits have no effect, which is exactly what scoring is for",""],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"frozen-baseline","title":"A baseline is three things that never change again"},"level":"apply","pool":"practice"},{"id":"q-licence-01","type":"single","prompt":"A licence allows anyone to fine-tune a model for research, and allows use in a product only under a separate agreement. A company fine-tunes it and now wants to put it in its paid service. What is its position?","options":[{"key":"A","text":"It may: the fine-tuned model is its own work"},{"key":"B","text":"It may: research use includes testing with paying customers"},{"key":"C","text":"It may not: adapting was licensed, this deployment is not"},{"key":"D","text":"It may, if it does not distribute the weights"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Adapting and deploying are separate permissions; the adapted model is a derivative under the same terms.","misconceptions":["Believes tuning creates a new work free of the original licence","Stretches \"research\" to cover a paid service","","Mixes up distribution with commercial use: not sharing the weights does not license the use"],"lo":["LO6"],"day":1,"session":3,"slide":{"deck":"day1","id":"three-permissions","title":"Adapt, deploy and distribute are three separate permissions"},"level":"analyze","pool":"practice"},{"id":"q-licence-02","type":"single","prompt":"A model card shows the licence tag \"other\". What is the next step before choosing the model?","options":[{"key":"A","text":"Assume it is permissive, since the weights are public"},{"key":"B","text":"Open the licence file, read it and record the date"},{"key":"C","text":"Ask in a forum what \"other\" usually means"},{"key":"D","text":"Train first and check the licence before deployment"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The tag is a label; the file is the licence, and it can change with a later release.","misconceptions":["Reads availability as permission","","Replaces the text with someone's opinion of it","Spends the training budget before knowing whether the result can be used"],"lo":["LO6"],"day":1,"session":3,"slide":{"deck":"day1","id":"tag-is-not-text","title":"Read the text, record the day, look for a second document"},"level":"apply","pool":"practice"},{"id":"q-licence-03","type":"single","prompt":"A licence grants commercial use only to organisations under a revenue threshold. Which pair of facts must the licence table record for an organisation that wants to deploy?","options":[{"key":"A","text":"Its annual revenue and whether the intended use is commercial under the licence's definition"},{"key":"B","text":"The model's size and its benchmark scores"},{"key":"C","text":"The size of the fine-tuning set and the number of adapters served"},{"key":"D","text":"Its number of employees and its country"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The clause turns on revenue against the threshold and on the purpose of the use; both are facts about the organisation.","misconceptions":["","Describes the model, not the licensee","Describes the project, which the clause does not depend on","Records facts the clause does not mention"],"lo":["LO6"],"day":1,"session":3,"slide":{"deck":"day1","id":"conditions-need-facts","title":"Two conditions turn on facts about the chamber"},"level":"evaluate","pool":"practice"},{"id":"q-cost-01","type":"single","prompt":"An owned accelerator costs SAR 6,000 a month in total and serves 30,000 requests a month. What is the cost per thousand requests?","options":[{"key":"A","text":"SAR 180"},{"key":"B","text":"SAR 2"},{"key":"C","text":"SAR 20"},{"key":"D","text":"SAR 200"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"6,000 divided by 30 thousands of requests is SAR 200 per thousand.","misconceptions":["Multiplies the monthly cost by the volume in tens of thousands instead of dividing","Divides by 3,000 thousands: a slip of two decimal places","Divides by 300 thousands: a slip of one decimal place",""],"lo":["LO6"],"day":1,"session":4,"slide":{"deck":"day1","id":"two-cost-shapes","title":"A hosted model costs per token; an owned accelerator costs per month"},"level":"apply","pool":"practice"},{"id":"q-cost-02","type":"single","prompt":"A hosted model costs SAR 0.50 per thousand requests and a tuned small model on the organisation's own servers costs SAR 140. The requests are classified Restricted and must stay on the organisation's servers. What should the decision memo say?","options":[{"key":"A","text":"The small model is the cheaper option"},{"key":"B","text":"The hosted model is chosen, because cost decides"},{"key":"C","text":"The small model is chosen for placement, at a stated premium"},{"key":"D","text":"Cost cannot be compared, because the two options are different"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The requirement rules the hosted option out; the memo states the premium honestly and why it is paid.","misconceptions":["States the opposite of the measured numbers","Ignores a requirement that the cheaper option does not meet","","Avoids a comparison that the same unit makes possible"],"lo":["LO6"],"day":1,"session":4,"slide":{"deck":"day1","id":"placement-decides","title":"Cost argues for the hosted model; placement rules it out"},"level":"evaluate","pool":"practice"},{"id":"q-cost-03","type":"single","prompt":"A prompted request carries 600 tokens of instructions and examples and 30 tokens of request. After tuning, the instructions are no longer sent. What happens to the input cost per request on a per-token price?","options":[{"key":"A","text":"It falls by 30 tokens"},{"key":"B","text":"It falls to about a twentieth"},{"key":"C","text":"It stays the same, because the output is unchanged"},{"key":"D","text":"It doubles, because adapters add tokens"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Input falls from about 630 tokens to about 30: the tuned model reads only the request.","misconceptions":["Subtracts the request instead of the instructions","","Confuses input and output tokens","Believes an adapter adds tokens: it adds weights, not text"],"lo":["LO6"],"day":1,"session":4,"slide":{"deck":"day1","id":"tokens-per-request","title":"A prompted request is mostly instructions"},"level":"analyze","pool":"practice"},{"id":"q-data-01","type":"single","prompt":"A tuning set is built only from traces that staff accepted without change. What is the model most likely to learn from it?","options":[{"key":"A","text":"To repeat what it already does"},{"key":"B","text":"To fix the failures staff corrected most often"},{"key":"C","text":"To handle the hardest requests, which staff reviewed with most care"},{"key":"D","text":"Nothing, because accepted traces carry no label"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"An accepted trace is labelled by the model's own output, so the set repeats current behaviour.","misconceptions":["","Expects corrections to be present in a set that left them out","Assumes acceptance means careful review; the hardest requests are the ones staff abandoned or corrected","Forgets that the accepted output is itself the label"],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"three-statuses","title":"Accepted, corrected, abandoned: three statuses, three kinds of label"},"level":"analyze","pool":"practice"},{"id":"q-data-02","type":"single","prompt":"A staff correction gives a registration number of nine digits; the tool requires ten. The intended number can be guessed from the request. What is the sound handling?","options":[{"key":"A","text":"Use the model's original answer as the label instead"},{"key":"B","text":"Add the missing digit and keep the row as a staff correction"},{"key":"C","text":"Keep the row as typed, because staff labels outrank the schema"},{"key":"D","text":"Drop the row and report it in the counts"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The tool would refuse the call, so it is not a usable label; dropping it visibly keeps every label traceable to its source.","misconceptions":["Uses the answer that staff rejected as a training target","Enters the engineer's guess under the desk's name, with no record of the change","Trains the model to produce a call the tool refuses",""],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"corrections-have-errors","title":"A correction is typed by a person at a busy desk"},"level":"apply","pool":"practice"},{"id":"q-data-03","type":"single","prompt":"A verifier keeps 97% of a teacher model's labels. A colleague writes \"label accuracy: 97%\" in the dataset card. What is wrong with the sentence?","options":[{"key":"A","text":"A card should not contain numbers that can change over time"},{"key":"B","text":"Nothing: the verifier measured it"},{"key":"C","text":"Yield counts what passed the checks, not what is right"},{"key":"D","text":"The figure should be 3%, the share rejected"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Passing schema and rule checks shows a label is well-formed and consistent with its request; whether it is right needs an audit.","misconceptions":["Removes the evidence a reader needs instead of correcting it","Treats passing a check as being correct","","Reports the rejected share as if it were the error rate of what was kept"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"yield-is-not-quality","title":"Yield says how much passed, not whether it is right"},"level":"evaluate","pool":"practice"},{"id":"q-data-04","type":"single","prompt":"A request names two registration numbers: the applicant's and a partner's. The teacher's call uses the partner's. Which check catches the error?","options":[{"key":"A","text":"A rule that the number in the call must appear in the request"},{"key":"B","text":"An audit by a person who reads the request"},{"key":"C","text":"A check that the call parses as JSON"},{"key":"D","text":"The schema check, because the number is invalid"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The call is valid and its number is in the request; only someone who makes the decision again can see that it is the wrong number.","misconceptions":["Overlooks that the partner's number does appear in the request","","Checks the form of a call whose form is fine","Assumes a wrong number is a malformed one: it has ten digits and passes"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"verifier-blind-spot","title":"Valid, consistent with the request, and wrong"},"level":"analyze","pool":"practice"},{"id":"q-data-05","type":"single","prompt":"Staff audit 30 kept teacher labels and find no error. Which statement belongs in the dataset card?","options":[{"key":"A","text":"No error in 30, which allows a true rate up to about 11%"},{"key":"B","text":"The audit was too small to report"},{"key":"C","text":"The kept labels contain no errors"},{"key":"D","text":"The error rate of the kept labels is below 1%, as the audit shows"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Zero in 30 bounds the rate; it does not show it is zero. The 95% upper bound is about 11%.","misconceptions":["","Hides a measurement that, with its bound, is useful to the reader","Reads \"none found\" as \"none exist\"","States a precision that a sample of 30 cannot give"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"yield-is-not-quality","title":"Yield says how much passed, not whether it is right"},"level":"apply","pool":"practice"},{"id":"q-data-06","type":"single","prompt":"After tuning, a model writes the correct tool call and then continues generating until the token limit. The training loss fell normally. What is the most likely cause?","options":[{"key":"A","text":"The learning rate was too low"},{"key":"B","text":"The adapter rank was too small to learn where an answer stops"},{"key":"C","text":"The tuning set held too few examples"},{"key":"D","text":"The training text had no end-of-turn token after the answer"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A model stops because it was shown stopping; if the rendered text never closes the turn, no setting teaches it to.","misconceptions":["Looks for an optimisation fault although the loss behaved normally","Treats a missing token in the data as a capacity limit","Blames quantity for a fault every example shares",""],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"three-faults","title":"Three faults that train \"fine\" and fail in service"},"level":"analyze","pool":"practice"},{"id":"q-data-07","type":"single","prompt":"In a tuning example the user's request is 26 tokens and the assistant's answer 56. With a correct label mask, on how many tokens is the loss taken?","options":[{"key":"A","text":"30"},{"key":"B","text":"26"},{"key":"C","text":"56"},{"key":"D","text":"82"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The prompt is masked with the ignore index; the loss is taken on the assistant's turn only.","misconceptions":["Subtracts the two counts instead of masking one of them","Supervises the request and ignores the answer: the mask reversed","","Takes the loss on the whole conversation, which trains the model to predict requests"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"label-mask","title":"The loss is taken on the assistant's turn only"},"level":"apply","pool":"practice"},{"id":"q-data-08","type":"single","prompt":"A team renders its tuning set with a hand-written format and serves the adapter behind a server that applies the base model's chat template. What should they expect?","options":[{"key":"A","text":"No effect, because the words of each example are the same"},{"key":"B","text":"Lower quality in service than in their own evaluation"},{"key":"C","text":"Slower training only"},{"key":"D","text":"An error when the adapter loads"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The adapter learnt one string format and is sent another; their own evaluation used the hand-written format and hides the gap.","misconceptions":["Ignores that role markers and special tokens are part of what the model reads","","Expects a cost in speed where the cost is in what was learnt","Expects a loud failure: a format mismatch raises no error"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"template-is-part-of-model","title":"The chat template is part of the model"},"level":"evaluate","pool":"practice"},{"id":"q-data-09","type":"single","prompt":"A tuning row nearly copies a test request and names the same company registration number. How is it handled?","options":[{"key":"A","text":"Removed from the tuning set and counted as a leak"},{"key":"B","text":"Kept, and the test request is deleted instead"},{"key":"C","text":"Kept, because the label may differ"},{"key":"D","text":"Kept, because near-copies are not exact copies"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"It is a test case inside the training data: every later score would be too high by an unknown amount.","misconceptions":["","Changes the test set after results exist, which breaks earlier comparisons","Looks at the label although the leak is in the request the model is examined on","Applies an exact-match standard that a greeting defeats"],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"leak-or-collision","title":"A leak is removed; a template collision is kept and counted"},"level":"analyze","pool":"practice"},{"id":"q-data-10","type":"single","prompt":"A near-duplicate rule at a lower threshold removes 82 rows; at a higher one, 67. What should decide between them?","options":[{"key":"A","text":"The threshold used in a published paper"},{"key":"B","text":"The lower threshold, because a smaller set trains faster"},{"key":"C","text":"The higher threshold, because more data is always better"},{"key":"D","text":"Reading a sample of the pairs each one removes"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A threshold is right when what it removes are duplicates; only reading the removed pairs shows whether different requests were merged.","misconceptions":["Borrows a number tuned on other data, with other text lengths","Chooses by training time, not by whether the removed rows were duplicates","Keeps rows without asking whether they are repeats",""],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"threshold-tradeoff","title":"At 0.8 the rule merged two different requests"},"level":"evaluate","pool":"practice"},{"id":"q-data-11","type":"single","prompt":"After masking, a scan for phone numbers, identity numbers, e-mail addresses and names from the member registry finds nothing. Which claim can the dataset card make?","options":[{"key":"A","text":"The set may be published"},{"key":"B","text":"The set contains no personal data"},{"key":"C","text":"The scan found none of four kinds, with names taken from one list"},{"key":"D","text":"Personal data was removed in line with the law, so no further review is needed"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A scan reports on what it looks for: a name outside the list, or a kind it does not know, passes.","misconceptions":["Draws a release decision from a scan that covers four kinds","Turns \"none found by this scan\" into \"none exists\"","","Turns one technical step into a legal conclusion"],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"personal-data-scan","title":"Patterns find numbers and addresses; names need a list"},"level":"evaluate","pool":"practice"},{"id":"q-data-12","type":"single","prompt":"Personal data is masked in the tuning set with placeholders such as [PHONE]. In service, requests reach the model unmasked. What is the main consequence?","options":[{"key":"A","text":"None: the model ignores digits"},{"key":"B","text":"Inputs unlike the training data, and personal data in the logs"},{"key":"C","text":"Training must be repeated with a larger rank to absorb the digits"},{"key":"D","text":"The adapter no longer loads on the base model"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The same masking function must run in front of the model in service, so that training and service inputs match.","misconceptions":["Assumes a tuned model is indifferent to tokens it never saw in that position","","Answers a data mismatch with a capacity setting","Expects a loading error from a difference in input text"],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"mask-both-sides","title":"Mask in training and in service, with the same function"},"level":"apply","pool":"practice"},{"id":"q-train-01","type":"single","prompt":"A rank-4 adapter is added to one weight matrix of shape 2,048 × 2,048. How many parameters does it add?","options":[{"key":"A","text":"16,384"},{"key":"B","text":"32,768"},{"key":"C","text":"4,194,304"},{"key":"D","text":"8,192"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"r × (d_in + d_out) = 4 × 4,096 = 16,384.","misconceptions":["","Uses rank 8, or counts the pair twice","Counts the full matrix, which stays frozen","Counts only one of the two small matrices: 4 × 2,048"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"lora-idea","title":"W stays frozen; the adapter adds B·A beside it"},"level":"apply","pool":"practice"},{"id":"q-train-02","type":"single","prompt":"Before the first training step, a model with a freshly added low-rank adapter gives exactly the outputs of its base. Why?","options":[{"key":"A","text":"The learning rate is zero during warm-up"},{"key":"B","text":"The base model ignores adapters at inference"},{"key":"C","text":"The adapter is switched off until the first optimiser step runs"},{"key":"D","text":"One adapter matrix starts at zero, so the product is zero"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"B starts at zero, so B·A adds nothing until training moves B.","misconceptions":["Confuses the size of the first steps with the starting value of the weights","Contradicts what an adapter is for","Invents a switch: the adapter is active from the start and contributes zero",""],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"lora-idea","title":"W stays frozen; the adapter adds B·A beside it"},"level":"analyze","pool":"practice"},{"id":"q-train-03","type":"single","prompt":"During a run the training loss falls from 0.9 to 0.05 while the validation loss falls to 0.30 at step 150 and rises to 0.45 by step 400. What is happening, and what do you do first?","options":[{"key":"A","text":"Normal behaviour: continue to step 800"},{"key":"B","text":"Underfitting: raise the rank"},{"key":"C","text":"Memorising the tuning set: stop near step 150 and check the set for near-copies"},{"key":"D","text":"A wrong label mask: train on the whole conversation"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Training loss falling while validation loss rises is the signature of memorising; the cheapest fix is to stop earlier.","misconceptions":["Pays for more steps of a run that is getting worse on unseen examples","Adds capacity to a run that already fits its data too closely","","Proposes a rendering change that would spend the loss on the request"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"two-curves","title":"Two curves: one on what it trained on, one on what it did not"},"level":"analyze","pool":"practice"},{"id":"q-train-04","type":"single","prompt":"Two adapters reach validation losses of 0.21 and 0.24. A colleague wants to ship the first on that evidence. What is missing?","options":[{"key":"A","text":"Nothing: the lower loss is the better model, by definition of loss"},{"key":"B","text":"The score on validation requests, graded as the tool grades"},{"key":"C","text":"A third adapter to break the tie"},{"key":"D","text":"The training loss of both"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The registry accepts a call or not; a small loss difference can go with either order of exact-match scores.","misconceptions":["Treats average token likelihood as the task metric","","Adds runs before measuring the two that exist","Looks at the examples the adapters were fitted to"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"loss-is-not-score","title":"A loss is not a score: grade the calls"},"level":"evaluate","pool":"practice"},{"id":"q-train-05","type":"single","prompt":"A teammate hands you an adapter file and its validation score. Which missing item most prevents you from reproducing the run?","options":[{"key":"A","text":"The run log: base and precision, data, settings, seed and curves"},{"key":"B","text":"The size of the adapter file in megabytes"},{"key":"C","text":"A screenshot of the loss curve"},{"key":"D","text":"The name of the engineer"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Reproducing a run needs what it was run on and with; that is what the log records.","misconceptions":["","Can be read from the file itself","Shows a shape but none of the settings or the data","Names who, not what was run"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"run-log","title":"An adapter without its run log cannot be reproduced"},"level":"apply","pool":"practice"},{"id":"q-memory-01","type":"single","prompt":"A base model has 3 billion parameters. Roughly how much memory do its weights take at 16 bits each?","options":[{"key":"A","text":"About 11 GB"},{"key":"B","text":"About 48 GB"},{"key":"C","text":"About 1.4 GB"},{"key":"D","text":"About 5.6 GB"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"3 billion × 2 bytes = 6 billion bytes, about 5.6 GB.","misconceptions":["Uses four bytes per weight: the 32-bit figure","Multiplies by 16 bytes instead of 16 bits","Uses half a byte per weight: the 4-bit figure",""],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"memory-arithmetic","title":"Whether a model fits is arithmetic: parameters times bits"},"level":"apply","pool":"practice"},{"id":"q-memory-02","type":"single","prompt":"A 4-bit base loads in 4 GB on a 16 GB accelerator, and training an adapter still runs out of memory. Which change addresses the cause most directly?","options":[{"key":"A","text":"Load the base in 16 bits"},{"key":"B","text":"Lower the adapter rank from 8 to 4, halving its parameters"},{"key":"C","text":"Lower the batch size or the maximum sequence length"},{"key":"D","text":"Lower the learning rate"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Activations grow with batch size × sequence length and are the large term above the weights.","misconceptions":["Raises the floor by a factor of about four","Shrinks the smallest term: the adapter is a few megabytes","","Changes the step size, not the memory"],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"weights-are-the-floor","title":"The weights are the floor; training adds three things on top"},"level":"analyze","pool":"practice"},{"id":"q-memory-03","type":"single","prompt":"An adapter was trained on a 4-bit base. Operations wants to serve it on the same base in 16 bits \"for better quality\". What do you advise?","options":[{"key":"A","text":"Agree: higher precision can only help"},{"key":"B","text":"Measure first: the adapter was fitted to the rounded weights"},{"key":"C","text":"Refuse: an adapter cannot be loaded on a base of another precision"},{"key":"D","text":"Agree, after doubling the adapter rank"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The adapter compensates partly for rounding; on unrounded weights its effect is untested until measured.","misconceptions":["Assumes the adapter is independent of the weights it was trained against","","States a technical impossibility that does not exist: it loads, and may behave differently","Changes the adapter without retraining it"],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"qlora-arrangement","title":"The base is rounded and frozen; the adapter trains in full precision"},"level":"evaluate","pool":"practice"},{"id":"q-sweep-01","type":"single","prompt":"In a sweep with one run per cell, rank 4 scores 96 of 120 and rank 16 scores 97. Which conclusion is sound?","options":[{"key":"A","text":"The two cannot be told apart; prefer rank 4"},{"key":"B","text":"Rank 4 is better because it is smaller"},{"key":"C","text":"The sweep must be discarded"},{"key":"D","text":"Rank 16 is better, because it scored one request more"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"One request in 120 is inside the noise of a single run; among equals, the cheaper setting.","misconceptions":["","Claims the smaller one is better in quality, which the scores do not show either","Throws away evidence that does rule out large differences","Reads one request as a real difference"],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"noise-in-a-sweep","title":"One run per cell, one seed: a few requests in 120 is not a difference"},"level":"evaluate","pool":"practice"},{"id":"q-sweep-02","type":"single","prompt":"A team tried twelve settings and reports the test score of the one that did best on the test set. What is wrong with the reported score?","options":[{"key":"A","text":"It is biased downward: more settings mean more noise in each score"},{"key":"B","text":"Twelve settings are too few for any claim"},{"key":"C","text":"Nothing, as long as the test set is large"},{"key":"D","text":"It is biased upward: the setting was selected on the test data"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The best of twelve on a set is partly the luckiest of twelve on that set.","misconceptions":["Gets the direction wrong: picking the maximum inflates","Blames the number of settings, not the use of the test set","Believes size removes selection bias",""],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"choose-on-validation","title":"Choose on validation requests; the test set stays closed until Day 4"},"level":"analyze","pool":"practice"},{"id":"q-sweep-03","type":"single","prompt":"A first adapter run shows a training loss that barely moves in 300 steps. Which setting do you examine first?","options":[{"key":"A","text":"The rank"},{"key":"B","text":"The adapter dropout"},{"key":"C","text":"The learning rate"},{"key":"D","text":"The random seed"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A loss that does not move is first a question of step size (after checking that anything is trainable).","misconceptions":["Adds capacity when the existing capacity is not being used","Starts with a regulariser when nothing is being learnt","","Expects a different seed to change whether learning happens at all"],"lo":["LO3"],"day":3,"session":3,"slide":{"deck":"day3","id":"settings-ranked","title":"A few settings decide the run; most can stay at a sensible value"},"level":"apply","pool":"practice"},{"id":"q-distil-01","type":"single","prompt":"In this course, a student is distilled by training it on a larger model's verified tool calls. What does the student receive from the teacher?","options":[{"key":"A","text":"The teacher's weights, compressed"},{"key":"B","text":"The teacher's final outputs, used as labels"},{"key":"C","text":"The teacher's system prompt"},{"key":"D","text":"The teacher's tokeniser"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Only outputs cross over: they become the labels of an ordinary tuning set.","misconceptions":["Confuses distillation with compressing or copying a model","","Confuses what the teacher was given with what the student learns from","Assumes shared vocabulary, which training on output text does not need"],"lo":["LO3"],"day":3,"session":4,"slide":{"deck":"day3","id":"what-distillation-is","title":"Distillation: the student learns from the teacher's answers"},"level":"analyze","pool":"practice"},{"id":"q-distil-02","type":"single","prompt":"A teacher labels 1 request in 50 wrongly, scattered over all kinds of request. A second teacher is wrong on every request of one rare kind and right elsewhere, also 1 in 50 overall. Which is the greater risk for the student?","options":[{"key":"A","text":"The second: a consistent error on one kind is learnt as the rule for that kind"},{"key":"B","text":"Neither: both are 2% noise"},{"key":"C","text":"Both equally, because the rate is the same"},{"key":"D","text":"The first: random errors are harder to find"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Scattered errors are outvoted by consistent right labels; a systematic error has nothing voting against it.","misconceptions":["","Treats structure in the errors as irrelevant","Reads the overall rate and ignores where the errors sit","Judges by how hard the errors are to find, not by what is learnt"],"lo":["LO3"],"day":3,"session":4,"slide":{"deck":"day3","id":"student-copies","title":"What the verifier let through, the student can learn"},"level":"evaluate","pool":"practice"},{"id":"q-distil-03","type":"single","prompt":"Which fact, on its own, rules out distilling from a hosted larger model for a government service?","options":[{"key":"A","text":"The larger model is slower than the student"},{"key":"B","text":"The student uses a different tokeniser"},{"key":"C","text":"The larger model costs money for each request, and budgets are fixed"},{"key":"D","text":"The requests are classified Restricted and may not be sent to it"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"If the data may not reach the teacher, the teacher cannot label it; cost, speed and tokenisers are workable.","misconceptions":["Applies a serving concern to a one-off labelling job","Assumes output text cannot cross between tokenisers","Treats a price as a prohibition",""],"lo":["LO3"],"day":3,"session":4,"slide":{"deck":"day3","id":"when-not-to-distil","title":"Distillation needs a better teacher, usable outputs and data that may be sent"},"level":"evaluate","pool":"practice"},{"id":"q-eval-01","type":"single","prompt":"Systems A and B score 300 and 290 on the same 400 requests. Which additional fact decides whether A is better?","options":[{"key":"A","text":"The score of a third system"},{"key":"B","text":"The average length of their answers, in tokens, on those requests"},{"key":"C","text":"How many requests each gets right that the other gets wrong"},{"key":"D","text":"The date each was evaluated"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"10 against 0 is a clear difference; 60 against 50 is not. The disagreements carry the evidence.","misconceptions":["Adds a system instead of reading the two in hand","Looks at a property unrelated to correctness","","Looks at when, not at what was measured"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"two-scores-hide","title":"The same two scores can hide very different disagreements"},"level":"analyze","pool":"practice"},{"id":"q-eval-02","type":"single","prompt":"A paired bootstrap on 400 requests resamples what, in each draw?","options":[{"key":"A","text":"The outputs of each system separately, a thousand times each"},{"key":"B","text":"The requests, keeping both systems' results on each one together"},{"key":"C","text":"The tokens of each output"},{"key":"D","text":"The two systems"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The request is the sampled unit; keeping the pair together is what makes the comparison paired.","misconceptions":["Breaks the pairing and widens the interval","","Resamples below the unit that was graded","Resamples the things being compared, of which there are two"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"paired-difference","title":"A paired difference is +1, 0 or −1 on each request"},"level":"apply","pool":"practice"},{"id":"q-eval-03","type":"single","prompt":"The paired interval for \"tuned minus base\" is +52 to +61 points; for \"tuned minus larger\" it is −9 to −2 points. Which summary is supported?","options":[{"key":"A","text":"Tuning worked; the larger model is still better here"},{"key":"B","text":"Tuning failed"},{"key":"C","text":"Nothing can be concluded"},{"key":"D","text":"Tuning worked, and the tuned model matches the larger one"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The first interval is above zero, the second below: two different sentences.","misconceptions":["","Ignores an interval that lies far above zero","Declines to read two intervals that both exclude zero","Ignores an interval that lies wholly below zero"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"what-the-table-supports","title":"Write what the interval supports, and nothing more"},"level":"evaluate","pool":"practice"},{"id":"q-eval-04","type":"single","prompt":"A tuned model is 4 points better than its alternative overall. In Arabic it is 3 points worse; in English 11 better. The service is used mostly in Arabic. What does the report lead with?","options":[{"key":"A","text":"The English result, because it is the largest"},{"key":"B","text":"The average of the two slices"},{"key":"C","text":"The overall gain"},{"key":"D","text":"The Arabic result, with its interval"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Report for the group the service serves; an overall figure hides the slice that matters most here.","misconceptions":["Leads with the most flattering number","Replaces two findings with a figure that describes neither","Leads with an average that most users will not experience",""],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"by-language","title":"An overall score can hide a language"},"level":"analyze","pool":"practice"},{"id":"q-regress-01","type":"single","prompt":"\"The base is frozen, so an adapter cannot make the model forget anything.\" What is wrong with this statement?","options":[{"key":"A","text":"Forgetting only happens above rank 64"},{"key":"B","text":"Nothing: frozen weights cannot change"},{"key":"C","text":"The base weights are intact; base plus adapter behaves differently"},{"key":"D","text":"Adapters do change the base weights slightly, during each backward pass"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The adapter is added to shared matrices; the combined model can lose behaviours while the base alone still has them.","misconceptions":["Invents a threshold; any rank changes behaviour","Confuses the weights with the behaviour of the adapted model","","Misdescribes the method: the base is not updated"],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"why-it-forgets","title":"The adapter is added to shared weights, for every input"},"level":"analyze","pool":"practice"},{"id":"q-regress-02","type":"single","prompt":"A tuning set of 600 examples maps every request to a tool call. After tuning, the model answers a request for a customer's phone number with a tool call instead of declining. What is the most direct cause?","options":[{"key":"A","text":"The learning rate was too high"},{"key":"B","text":"The set never showed a refusal, so \"always call a tool\" is what it taught"},{"key":"C","text":"The base model never refused"},{"key":"D","text":"The test set leaked into training"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The adapter learnt the one rule its data was consistent with.","misconceptions":["Blames a setting for a gap in the data","","Contradicts the premise: the regression is a change from the base","Names a different fault, which would inflate scores, not remove refusals"],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"refusal-check","title":"Nothing in the tuning set told the model to stop refusing"},"level":"analyze","pool":"practice"},{"id":"q-regress-03","type":"single","prompt":"Which examples are suitable replay data for keeping a base model's refusal behaviour through tuning?","options":[{"key":"A","text":"Refusal examples outside the check, mixed into the tuning set"},{"key":"B","text":"More task examples"},{"key":"C","text":"Examples from the test set"},{"key":"D","text":"The items of the refusal check itself, since they are already written"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Replay shows the behaviour during training; the check must stay unseen to remain a check.","misconceptions":["","Adds more of what caused the regression","Spends the test set","Trains on the check, which then measures nothing"],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"replay","title":"Replay: show the adapter what it must keep"},"level":"apply","pool":"practice"},{"id":"q-regress-04","type":"single","prompt":"When should the rule \"which regression blocks a release\" be written?","options":[{"key":"A","text":"Only if a regression is found"},{"key":"B","text":"By the vendor of the base model"},{"key":"C","text":"After the tuned model's numbers are known, to fit them"},{"key":"D","text":"Before the numbers are known"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A threshold chosen after seeing the result is a description of the result, not a rule.","misconceptions":["Leaves no rule for the case that most needs one","Hands an owner's decision to a party who does not carry the risk","Lets the result set its own pass mark",""],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"release-rule","title":"Write the release rule before you see the next model's numbers"},"level":"evaluate","pool":"practice"},{"id":"q-regress-05","type":"single","prompt":"A general check of five tasks shows no regression after tuning. Which statement may the model card make?","options":[{"key":"A","text":"\"General abilities improved\""},{"key":"B","text":"\"Tuning did not affect any of the other abilities\""},{"key":"C","text":"\"No regression on the five tasks checked\""},{"key":"D","text":"\"The model is safe\""}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A check covers what it tests; abilities outside it are unmeasured.","misconceptions":["Reports a direction the check did not show","Extends five tasks to everything","","Draws a safety claim from an ability check"],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"general-check","title":"General abilities, before and after tuning"},"level":"evaluate","pool":"practice"},{"id":"q-serve-01","type":"single","prompt":"An organisation serves three tuned tasks. Each could be a fully fine-tuned copy of a 7-billion-parameter model, or one adapter on a shared base. What is the main saving of the adapter arrangement at serving time?","options":[{"key":"A","text":"Each request needs fewer tokens"},{"key":"B","text":"One base in memory instead of three"},{"key":"C","text":"Adapters need no accelerator"},{"key":"D","text":"Adapters remove the need for evaluation"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The base is loaded once; each task adds megabytes, not gigabytes.","misconceptions":["Confuses weights with text: adapters do not shorten requests","","The base still runs on the accelerator","Each adapter is a model to be evaluated"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"one-base-many-adapters","title":"One base in memory, one small adapter for each task"},"level":"analyze","pool":"practice"},{"id":"q-serve-02","type":"single","prompt":"In a load test, throughput rises from 20 to 55 requests a second as requests in flight go from 4 to 16. What explains the rise?","options":[{"key":"A","text":"Requests that arrive together share each forward pass"},{"key":"B","text":"The adapters are cached after first use, so later requests skip them"},{"key":"C","text":"Latency falls as load rises"},{"key":"D","text":"The model gets faster as it warms up"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Batching: one pass serves several requests in little more time than one.","misconceptions":["","Describes loading, which happens once, not per request","States the opposite of what happens: latency rises with load","Attributes a batching effect to warm-up"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"batching","title":"Requests that arrive together share each forward pass"},"level":"analyze","pool":"practice"},{"id":"q-serve-03","type":"single","prompt":"A service answers 50,000 requests a month with a p99 latency of 4 seconds. About how many requests take longer than 4 seconds?","options":[{"key":"A","text":"2,500"},{"key":"B","text":"5,000"},{"key":"C","text":"50"},{"key":"D","text":"500"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"One in a hundred of 50,000 is 500.","misconceptions":["Takes one in twenty: the p95 share","Takes one in ten","Takes one in a thousand",""],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"percentiles","title":"A member who waits is a percentile, not a mean"},"level":"apply","pool":"practice"},{"id":"q-serve-04","type":"single","prompt":"A report states: \"The server handles 70 requests per second.\" Which addition makes the figure usable for planning?","options":[{"key":"A","text":"The date of the test"},{"key":"B","text":"The brand of the accelerator"},{"key":"C","text":"The latency percentile and target at that throughput, and the failure rate"},{"key":"D","text":"The number of adapters loaded"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Capacity is throughput under a latency target with no failures; without those the figure is not a capacity.","misconceptions":["Adds context that does not qualify the number","Names the hardware but not what was achieved on it","","Describes the configuration, not the service level"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"percentiles","title":"A member who waits is a percentile, not a mean"},"level":"evaluate","pool":"practice"},{"id":"q-serve-05","type":"single","prompt":"A machine costs SAR 9,000 a month and can answer 2 million requests a month at its latency target. The service receives 60,000. What is the cost per thousand requests?","options":[{"key":"A","text":"SAR 4.50"},{"key":"B","text":"SAR 150"},{"key":"C","text":"SAR 15"},{"key":"D","text":"SAR 0.15"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"9,000 ÷ 60 thousands of requests answered = SAR 150.","misconceptions":["Divides by the capacity of 2,000 thousands instead of the requests answered","","Divides by 600 thousands: a slip of one decimal place","Divides by 60,000 thousands"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"cost-per-thousand","title":"A fixed monthly cost, divided by what the machine actually answers"},"level":"apply","pool":"practice"},{"id":"q-serve-06","type":"single","prompt":"The cost per thousand requests on an owned machine is 300 times the cost at full capacity, because the machine is mostly idle. Which response addresses the cause?","options":[{"key":"A","text":"Serve more tasks from the same base with additional adapters"},{"key":"B","text":"Lower the adapter rank"},{"key":"C","text":"Raise the latency target"},{"key":"D","text":"Quantise the model further, so that each answer takes less time"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The cost is fixed; sharing the machine across more work is what lowers the cost of each request.","misconceptions":["","Shrinks a file that is not the cost","Raises a capacity that is not being used","Speeds up a machine that is already idle"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"cost-per-thousand","title":"A fixed monthly cost, divided by what the machine actually answers"},"level":"evaluate","pool":"practice"},{"id":"q-memo-01","type":"single","prompt":"Which sentence belongs in the limits section of a dataset card?","options":[{"key":"A","text":"\"All personal data has been removed, as confirmed by the automatic scan\""},{"key":"B","text":"\"The dataset is unbiased\""},{"key":"C","text":"\"The dataset is of high quality\""},{"key":"D","text":"\"Accepted traces were not reviewed; an audit of 30 allows up to 11%\""}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A limit states what was and was not checked, with numbers a reader can weigh.","misconceptions":["Claims more than a scan of four kinds can support","Claims a property nobody measured","Asserts quality without evidence",""],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"dataset-card","title":"A dataset card is filled from reports, not from memory"},"level":"evaluate","pool":"practice"},{"id":"q-memo-02","type":"single","prompt":"A decision memo recommends a tuned small model that scores below a hosted alternative and costs more per request. Which fact can still justify the recommendation?","options":[{"key":"A","text":"Small models are the current trend"},{"key":"B","text":"The small model was more interesting to build and the team learnt more"},{"key":"C","text":"The data is classified so that it may not leave the organisation"},{"key":"D","text":"The team has already spent the budget"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A placement requirement rules the alternative out; the memo then states the premium paid for it.","misconceptions":["Appeals to fashion","Offers the team's interest as a reason for the owner","","Justifies by sunk cost"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"memo-four-weights","title":"The memo weighs four things, each with a number and its source"},"level":"analyze","pool":"practice"},{"id":"q-memo-03","type":"single","prompt":"Evaluation shows a tuned model is worse than a hosted larger model, the data is public, and the hosted model's terms allow the use. What should the memo recommend?","options":[{"key":"A","text":"Ship the tuned model: the work is done"},{"key":"B","text":"Do not ship: use the hosted model, and say what would change the answer"},{"key":"C","text":"Ship both and let users choose"},{"key":"D","text":"Tune for another month"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The alternative is better and allowed; \"do not ship\" on good evidence is a complete answer.","misconceptions":["Lets effort spent decide","","Passes the decision to people without the evidence","Continues without a reason to expect a different result"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"the-decision","title":"Ship, ship with conditions, or do not ship: all three are full answers"},"level":"evaluate","pool":"practice"},{"id":"q-memo-04","type":"single","prompt":"A model card reports the task score and the training settings. Which section is most often left out and most needed by someone deciding whether to deploy?","options":[{"key":"A","text":"What got worse after tuning"},{"key":"B","text":"The number of training steps"},{"key":"C","text":"The file size of the adapter"},{"key":"D","text":"The name of the base model"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Regressions are what a deployer cannot see from the task score.","misconceptions":["","Describes the run, not its side effects","Is a fact the file itself gives","Is usually present"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"model-card","title":"A model card reports by slice, and says what got worse"},"level":"apply","pool":"practice"}]}</script>
