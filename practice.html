<section>
<h2>Day 1: Decide whether to adapt</h2>
<ol>
<li><p>Qayd writes valid calls, but for "building materials" it answers with activity code G-46. The larger model, with the same instructions, makes the same mistake. What do you try first?</p><ul><li><b>A.</b> Tune the small model on examples that contain the codes</li><li><b>B.</b> Replace the small model with a larger one</li><li><b>C.</b> Put the chamber's code table in the context</li><li><b>D.</b> Add a stricter output schema</li></ul></li>
<li><p>A colleague reports: "Our adapter scores 84 on the 100 requests; the prompted model scored 27." The 27 is version 0. What does the report show?</p><ul><li><b>A.</b> Less than it claims: the adapter must be compared with the frozen baseline, 67</li><li><b>B.</b> That tuning gained 57 points</li><li><b>C.</b> Nothing, because 100 requests are too few to measure anything</li><li><b>D.</b> That the adapter should be compared with the larger model only</li></ul></li>
<li><p>A model's licence allows commercial use only to organisations with annual revenue under USD 10 million. The chamber's revenue is above that, and its registration service charges fees. What goes in the "deploy" column?</p><ul><li><b>A.</b> Yes: the weights are open, so use is free</li><li><b>B.</b> Yes: a chamber is a non-profit body, so the limit cannot apply</li><li><b>C.</b> Yes, once the model is fine-tuned, because the adapter is ours</li><li><b>D.</b> Ask: counsel must decide whether a fee-charging service is commercial use</li></ul></li>
<li><p>The chamber's requests double to 80,000 a month. The accelerator still has spare capacity. What happens to the cost per thousand requests?</p><ul><li><b>A.</b> Both options stay the same</li><li><b>B.</b> Hosted stays the same; the owned accelerator's halves</li><li><b>C.</b> Hosted halves; the owned accelerator's stays the same</li><li><b>D.</b> Both double</li></ul></li>
<li><p>A prompted model answers customers politely and in the right format, but quotes a renewal fee that was correct last year. Which change addresses the cause?</p><ul><li><b>A.</b> Fine-tune it on this year's conversations</li><li><b>B.</b> Give it the current fee table in the context</li><li><b>C.</b> Lower the sampling temperature until the fee is stable</li><li><b>D.</b> Distil a larger model's answers into it</li></ul></li>
<li><p>On 100 requests a small model makes 30 behaviour failures and a larger model, with the same instructions, makes 4. What does the pair of counts support?</p><ul><li><b>A.</b> Tuning or distillation can teach it to the small model</li><li><b>B.</b> The requests are too hard for any model</li><li><b>C.</b> The small model lacks a fact that must be retrieved each time</li><li><b>D.</b> The grading code is wrong for the small model</li></ul></li>
<li><p>A model's answer is the correct tool call, written inside a Markdown code fence instead of the required tags, and the parser rejects it. Which failure class is it?</p><ul><li><b>A.</b> Not a failure, because the decision is right</li><li><b>B.</b> Knowledge</li><li><b>C.</b> Behaviour</li><li><b>D.</b> Format</li></ul></li>
<li><p>Which task is the best candidate for a tuned small model on one accelerator?</p><ul><li><b>A.</b> Planning a company's tax filing across several systems</li><li><b>B.</b> Answering any question about commercial law</li><li><b>C.</b> Extracting the same eight fields from thousands of similar forms</li><li><b>D.</b> Reviewing rare contracts that each need a lawyer's judgement</li></ul></li>
<li><p>A team reports that fine-tuning raised accuracy from 31% to 82%. The 31% used a one-sentence prompt. What should a reviewer ask for first?</p><ul><li><b>A.</b> A comparison with a model twice the size, tuned alike</li><li><b>B.</b> The score of the best prompt on the same model</li><li><b>C.</b> A larger training set</li><li><b>D.</b> The training loss curve</li></ul></li>
<li><p>Two prompt versions score 50 and 52 right out of the same 100 requests. Which statement is supported?</p><ul><li><b>A.</b> The versions cannot be told apart on this evidence</li><li><b>B.</b> Version two would score 52% on any hundred requests</li><li><b>C.</b> One hundred requests prove nothing about either</li><li><b>D.</b> Version two is better by two points</li></ul></li>
<li><p>After the baseline was frozen, an engineer improves one sentence of the instructions and keeps quoting the old score. What is wrong?</p><ul><li><b>A.</b> The set must be changed as well</li><li><b>B.</b> The score should be averaged with the new one, weighted by date</li><li><b>C.</b> Nothing: one sentence cannot change a score</li><li><b>D.</b> The old score belongs to a text no longer in use</li></ul></li>
<li><p>A licence allows anyone to fine-tune a model for research, and allows use in a product only under a separate agreement. A company fine-tunes it and now wants to put it in its paid service. What is its position?</p><ul><li><b>A.</b> It may: the fine-tuned model is its own work</li><li><b>B.</b> It may: research use includes testing with paying customers</li><li><b>C.</b> It may not: adapting was licensed, this deployment is not</li><li><b>D.</b> It may, if it does not distribute the weights</li></ul></li>
<li><p>A model card shows the licence tag "other". What is the next step before choosing the model?</p><ul><li><b>A.</b> Assume it is permissive, since the weights are public</li><li><b>B.</b> Open the licence file, read it and record the date</li><li><b>C.</b> Ask in a forum what "other" usually means</li><li><b>D.</b> Train first and check the licence before deployment</li></ul></li>
<li><p>A licence grants commercial use only to organisations under a revenue threshold. Which pair of facts must the licence table record for an organisation that wants to deploy?</p><ul><li><b>A.</b> Its annual revenue and whether the intended use is commercial under the licence's definition</li><li><b>B.</b> The model's size and its benchmark scores</li><li><b>C.</b> The size of the fine-tuning set and the number of adapters served</li><li><b>D.</b> Its number of employees and its country</li></ul></li>
<li><p>An owned accelerator costs SAR 6,000 a month in total and serves 30,000 requests a month. What is the cost per thousand requests?</p><ul><li><b>A.</b> SAR 180</li><li><b>B.</b> SAR 2</li><li><b>C.</b> SAR 20</li><li><b>D.</b> SAR 200</li></ul></li>
<li><p>A hosted model costs SAR 0.50 per thousand requests and a tuned small model on the organisation's own servers costs SAR 140. The requests are classified Restricted and must stay on the organisation's servers. What should the decision memo say?</p><ul><li><b>A.</b> The small model is the cheaper option</li><li><b>B.</b> The hosted model is chosen, because cost decides</li><li><b>C.</b> The small model is chosen for placement, at a stated premium</li><li><b>D.</b> Cost cannot be compared, because the two options are different</li></ul></li>
<li><p>A prompted request carries 600 tokens of instructions and examples and 30 tokens of request. After tuning, the instructions are no longer sent. What happens to the input cost per request on a per-token price?</p><ul><li><b>A.</b> It falls by 30 tokens</li><li><b>B.</b> It falls to about a twentieth</li><li><b>C.</b> It stays the same, because the output is unchanged</li><li><b>D.</b> It doubles, because adapters add tokens</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Data for tuning</h2>
<ol>
<li><p>With the frozen instructions, Qayd still takes a partner company's registration number in some requests. The code table and the schema are in the prompt. Which examples must today's tuning set contain?</p><ul><li><b>A.</b> More rows of the activity code table</li><li><b>B.</b> Requests with two registration numbers, labelled with the applicant's own</li><li><b>C.</b> More requests that Qayd already answers correctly</li><li><b>D.</b> Examples of well-formed JSON</li></ul></li>
<li><p>A corrected trace has the desk's call {"name": "update_record", "arguments": {"cr_number": "4031582699", "field": "city", "value": "الدمام"}}. The interface lists cities in English. What do you do with it?</p><ul><li><b>A.</b> Keep it: a human correction is always right</li><li><b>B.</b> Change the value to "Dammam" and keep it as a correction</li><li><b>C.</b> Drop it and count it, or send it back to the desk</li><li><b>D.</b> Replace it with Qayd's original output</li></ul></li>
<li><p>A teacher labelled 1,000 requests. Schema and rule checks kept 960. Nobody has read any of them. What can you state about the 960?</p><ul><li><b>A.</b> They are 96% accurate</li><li><b>B.</b> They contain no errors, because the bad ones were rejected</li><li><b>C.</b> They cannot be used until every one is read by staff</li><li><b>D.</b> They are valid and consistent with their requests; their error rate is unknown until a sample is audited</li></ul></li>
<li><p>A freshly tuned adapter produces the correct tool call and then continues with more calls and stray text until the token limit. The base model never did this. Where do you look first?</p><ul><li><b>A.</b> The rendered training text: is there an end-of-turn token after the assistant's answer?</li><li><b>B.</b> The learning rate: it was too high</li><li><b>C.</b> The server: raise the stop-token limit</li><li><b>D.</b> The tuning set: it needs more examples</li></ul></li>
<li><p>Your overlap check flags a tuning row: "We want to renew for two years. Thank you." The same sentence is in the test set. Neither names a company or a number. What goes in the report?</p><ul><li><b>A.</b> A leak: remove it, and remove every row like it</li><li><b>B.</b> A template collision: keep it, and report how many there are</li><li><b>C.</b> Nothing: generic sentences need no mention</li><li><b>D.</b> Remove the sentence from the test set instead</li></ul></li>
<li><p>A tuning set is built only from traces that staff accepted without change. What is the model most likely to learn from it?</p><ul><li><b>A.</b> To repeat what it already does</li><li><b>B.</b> To fix the failures staff corrected most often</li><li><b>C.</b> To handle the hardest requests, which staff reviewed with most care</li><li><b>D.</b> Nothing, because accepted traces carry no label</li></ul></li>
<li><p>A staff correction gives a registration number of nine digits; the tool requires ten. The intended number can be guessed from the request. What is the sound handling?</p><ul><li><b>A.</b> Use the model's original answer as the label instead</li><li><b>B.</b> Add the missing digit and keep the row as a staff correction</li><li><b>C.</b> Keep the row as typed, because staff labels outrank the schema</li><li><b>D.</b> Drop the row and report it in the counts</li></ul></li>
<li><p>A verifier keeps 97% of a teacher model's labels. A colleague writes "label accuracy: 97%" in the dataset card. What is wrong with the sentence?</p><ul><li><b>A.</b> A card should not contain numbers that can change over time</li><li><b>B.</b> Nothing: the verifier measured it</li><li><b>C.</b> Yield counts what passed the checks, not what is right</li><li><b>D.</b> The figure should be 3%, the share rejected</li></ul></li>
<li><p>A request names two registration numbers: the applicant's and a partner's. The teacher's call uses the partner's. Which check catches the error?</p><ul><li><b>A.</b> A rule that the number in the call must appear in the request</li><li><b>B.</b> An audit by a person who reads the request</li><li><b>C.</b> A check that the call parses as JSON</li><li><b>D.</b> The schema check, because the number is invalid</li></ul></li>
<li><p>Staff audit 30 kept teacher labels and find no error. Which statement belongs in the dataset card?</p><ul><li><b>A.</b> No error in 30, which allows a true rate up to about 11%</li><li><b>B.</b> The audit was too small to report</li><li><b>C.</b> The kept labels contain no errors</li><li><b>D.</b> The error rate of the kept labels is below 1%, as the audit shows</li></ul></li>
<li><p>After tuning, a model writes the correct tool call and then continues generating until the token limit. The training loss fell normally. What is the most likely cause?</p><ul><li><b>A.</b> The learning rate was too low</li><li><b>B.</b> The adapter rank was too small to learn where an answer stops</li><li><b>C.</b> The tuning set held too few examples</li><li><b>D.</b> The training text had no end-of-turn token after the answer</li></ul></li>
<li><p>In a tuning example the user's request is 26 tokens and the assistant's answer 56. With a correct label mask, on how many tokens is the loss taken?</p><ul><li><b>A.</b> 30</li><li><b>B.</b> 26</li><li><b>C.</b> 56</li><li><b>D.</b> 82</li></ul></li>
<li><p>A team renders its tuning set with a hand-written format and serves the adapter behind a server that applies the base model's chat template. What should they expect?</p><ul><li><b>A.</b> No effect, because the words of each example are the same</li><li><b>B.</b> Lower quality in service than in their own evaluation</li><li><b>C.</b> Slower training only</li><li><b>D.</b> An error when the adapter loads</li></ul></li>
<li><p>A tuning row nearly copies a test request and names the same company registration number. How is it handled?</p><ul><li><b>A.</b> Removed from the tuning set and counted as a leak</li><li><b>B.</b> Kept, and the test request is deleted instead</li><li><b>C.</b> Kept, because the label may differ</li><li><b>D.</b> Kept, because near-copies are not exact copies</li></ul></li>
<li><p>A near-duplicate rule at a lower threshold removes 82 rows; at a higher one, 67. What should decide between them?</p><ul><li><b>A.</b> The threshold used in a published paper</li><li><b>B.</b> The lower threshold, because a smaller set trains faster</li><li><b>C.</b> The higher threshold, because more data is always better</li><li><b>D.</b> Reading a sample of the pairs each one removes</li></ul></li>
<li><p>After masking, a scan for phone numbers, identity numbers, e-mail addresses and names from the member registry finds nothing. Which claim can the dataset card make?</p><ul><li><b>A.</b> The set may be published</li><li><b>B.</b> The set contains no personal data</li><li><b>C.</b> The scan found none of four kinds, with names taken from one list</li><li><b>D.</b> Personal data was removed in line with the law, so no further review is needed</li></ul></li>
<li><p>Personal data is masked in the tuning set with placeholders such as [PHONE]. In service, requests reach the model unmasked. What is the main consequence?</p><ul><li><b>A.</b> None: the model ignores digits</li><li><b>B.</b> Inputs unlike the training data, and personal data in the logs</li><li><b>C.</b> Training must be repeated with a larger rank to absorb the digits</li><li><b>D.</b> The adapter no longer loads on the base model</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Train adapters and distil</h2>
<ol>
<li><p>You are about to train on 661 examples. Which check from yesterday can no longer be made once the run has finished and the loss has fallen?</p><ul><li><b>A.</b> That the tuned model beats the base on the test set</li><li><b>B.</b> That the validation loss fell</li><li><b>C.</b> That the rendered text ends the turn and matches the model's template</li><li><b>D.</b> That the adapter has the intended rank</li></ul></li>
<li><p>A base has 24 layers. You put a rank-8 adapter on the query and value projections of each layer; each is a 1,024 × 1,024 matrix. How many parameters train?</p><ul><li><b>A.</b> 16,384</li><li><b>B.</b> 32,768</li><li><b>C.</b> 786,432</li><li><b>D.</b> 50,331,648</li></ul></li>
<li><p>An accelerator has 16 GB of memory. You want to train an adapter on a base with 7 billion parameters. What does the arithmetic say?</p><ul><li><b>A.</b> Load it in 16 bits: 13 GB of weights fit in 16 GB</li><li><b>B.</b> Load it in 4 bits: about 3.5 GB of weights, leaving room for activations</li><li><b>C.</b> Either: only the adapter needs memory, and it is tiny</li><li><b>D.</b> It cannot be done on this accelerator</li></ul></li>
<li><p>On 120 validation requests: rank 8 scores 101, rank 32 scores 102, rank 64 scores 100. Each is one run. Which do you choose, and on what ground?</p><ul><li><b>A.</b> Rank 8: the three cannot be told apart, and it is the cheapest</li><li><b>B.</b> Rank 32: it has the highest score</li><li><b>C.</b> Rank 64: more capacity is safer</li><li><b>D.</b> Whichever scores best on the test set</li></ul></li>
<li><p>A distilled student takes the partner company's registration number in requests that name two. An audit shows the teacher does the same in about one such request in five. What do you change first?</p><ul><li><b>A.</b> Train the student for more steps</li><li><b>B.</b> Raise the adapter's rank</li><li><b>C.</b> Lower the sampling temperature of the student</li><li><b>D.</b> The data: correct or remove those teacher labels, or add staff corrections for that kind of request</li></ul></li>
<li><p>A rank-4 adapter is added to one weight matrix of shape 2,048 × 2,048. How many parameters does it add?</p><ul><li><b>A.</b> 16,384</li><li><b>B.</b> 32,768</li><li><b>C.</b> 4,194,304</li><li><b>D.</b> 8,192</li></ul></li>
<li><p>Before the first training step, a model with a freshly added low-rank adapter gives exactly the outputs of its base. Why?</p><ul><li><b>A.</b> The learning rate is zero during warm-up</li><li><b>B.</b> The base model ignores adapters at inference</li><li><b>C.</b> The adapter is switched off until the first optimiser step runs</li><li><b>D.</b> One adapter matrix starts at zero, so the product is zero</li></ul></li>
<li><p>During a run the training loss falls from 0.9 to 0.05 while the validation loss falls to 0.30 at step 150 and rises to 0.45 by step 400. What is happening, and what do you do first?</p><ul><li><b>A.</b> Normal behaviour: continue to step 800</li><li><b>B.</b> Underfitting: raise the rank</li><li><b>C.</b> Memorising the tuning set: stop near step 150 and check the set for near-copies</li><li><b>D.</b> A wrong label mask: train on the whole conversation</li></ul></li>
<li><p>Two adapters reach validation losses of 0.21 and 0.24. A colleague wants to ship the first on that evidence. What is missing?</p><ul><li><b>A.</b> Nothing: the lower loss is the better model, by definition of loss</li><li><b>B.</b> The score on validation requests, graded as the tool grades</li><li><b>C.</b> A third adapter to break the tie</li><li><b>D.</b> The training loss of both</li></ul></li>
<li><p>A teammate hands you an adapter file and its validation score. Which missing item most prevents you from reproducing the run?</p><ul><li><b>A.</b> The run log: base and precision, data, settings, seed and curves</li><li><b>B.</b> The size of the adapter file in megabytes</li><li><b>C.</b> A screenshot of the loss curve</li><li><b>D.</b> The name of the engineer</li></ul></li>
<li><p>A base model has 3 billion parameters. Roughly how much memory do its weights take at 16 bits each?</p><ul><li><b>A.</b> About 11 GB</li><li><b>B.</b> About 48 GB</li><li><b>C.</b> About 1.4 GB</li><li><b>D.</b> About 5.6 GB</li></ul></li>
<li><p>A 4-bit base loads in 4 GB on a 16 GB accelerator, and training an adapter still runs out of memory. Which change addresses the cause most directly?</p><ul><li><b>A.</b> Load the base in 16 bits</li><li><b>B.</b> Lower the adapter rank from 8 to 4, halving its parameters</li><li><b>C.</b> Lower the batch size or the maximum sequence length</li><li><b>D.</b> Lower the learning rate</li></ul></li>
<li><p>An adapter was trained on a 4-bit base. Operations wants to serve it on the same base in 16 bits "for better quality". What do you advise?</p><ul><li><b>A.</b> Agree: higher precision can only help</li><li><b>B.</b> Measure first: the adapter was fitted to the rounded weights</li><li><b>C.</b> Refuse: an adapter cannot be loaded on a base of another precision</li><li><b>D.</b> Agree, after doubling the adapter rank</li></ul></li>
<li><p>In a sweep with one run per cell, rank 4 scores 96 of 120 and rank 16 scores 97. Which conclusion is sound?</p><ul><li><b>A.</b> The two cannot be told apart; prefer rank 4</li><li><b>B.</b> Rank 4 is better because it is smaller</li><li><b>C.</b> The sweep must be discarded</li><li><b>D.</b> Rank 16 is better, because it scored one request more</li></ul></li>
<li><p>A team tried twelve settings and reports the test score of the one that did best on the test set. What is wrong with the reported score?</p><ul><li><b>A.</b> It is biased downward: more settings mean more noise in each score</li><li><b>B.</b> Twelve settings are too few for any claim</li><li><b>C.</b> Nothing, as long as the test set is large</li><li><b>D.</b> It is biased upward: the setting was selected on the test data</li></ul></li>
<li><p>A first adapter run shows a training loss that barely moves in 300 steps. Which setting do you examine first?</p><ul><li><b>A.</b> The rank</li><li><b>B.</b> The adapter dropout</li><li><b>C.</b> The learning rate</li><li><b>D.</b> The random seed</li></ul></li>
<li><p>In this course, a student is distilled by training it on a larger model's verified tool calls. What does the student receive from the teacher?</p><ul><li><b>A.</b> The teacher's weights, compressed</li><li><b>B.</b> The teacher's final outputs, used as labels</li><li><b>C.</b> The teacher's system prompt</li><li><b>D.</b> The teacher's tokeniser</li></ul></li>
<li><p>A teacher labels 1 request in 50 wrongly, scattered over all kinds of request. A second teacher is wrong on every request of one rare kind and right elsewhere, also 1 in 50 overall. Which is the greater risk for the student?</p><ul><li><b>A.</b> The second: a consistent error on one kind is learnt as the rule for that kind</li><li><b>B.</b> Neither: both are 2% noise</li><li><b>C.</b> Both equally, because the rate is the same</li><li><b>D.</b> The first: random errors are harder to find</li></ul></li>
<li><p>Which fact, on its own, rules out distilling from a hosted larger model for a government service?</p><ul><li><b>A.</b> The larger model is slower than the student</li><li><b>B.</b> The student uses a different tokeniser</li><li><b>C.</b> The larger model costs money for each request, and budgets are fixed</li><li><b>D.</b> The requests are classified Restricted and may not be sent to it</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Evaluate and serve</h2>
<ol>
<li><p>Yesterday you chose a rank and a learning rate. A colleague suggests checking the three best settings on the test set this morning and shipping the winner. What is wrong with that?</p><ul><li><b>A.</b> The test set is too small to compare three settings</li><li><b>B.</b> The winner's test score would then be a score it was selected on, not an estimate for new requests</li><li><b>C.</b> Evaluating three adapters changes their weights</li><li><b>D.</b> It takes too long</li></ul></li>
<li><p>On 400 held-out requests a tuned model scores 352 and a larger prompted model 360. The tuned model alone is right on 18 requests, the larger alone on 26. The paired interval for the difference is −5.3 to +1.3 points. What do you write?</p><ul><li><b>A.</b> The larger model is better by 2 points</li><li><b>B.</b> The two models are equally good</li><li><b>C.</b> No difference is shown on this test set; the interval runs from 5.3 points worse to 1.3 better</li><li><b>D.</b> The test is inconclusive and should not be reported</li></ul></li>
<li><p>A tuned model gains 30 points on its task. On a general check it holds its score on four tasks and falls from 40 of 40 to 12 of 40 on translation. The overall general score falls by 14%. What goes in the model card?</p><ul><li><b>A.</b> The regression by task: translation fell from 40 to 12 of 40; the other four held</li><li><b>B.</b> "General abilities: −14%"</li><li><b>C.</b> Only the task gain: the model is for the task</li><li><b>D.</b> "No other abilities were affected"</li></ul></li>
<li><p>A load test gives: 4 in flight, 20 requests/s, p95 300 ms; 16 in flight, 55 requests/s, p95 900 ms; 64 in flight, 70 requests/s, p95 3,400 ms. The service must answer 95% of requests within one second. What capacity do you plan with?</p><ul><li><b>A.</b> 70 requests a second</li><li><b>B.</b> 55 requests a second</li><li><b>C.</b> 20 requests a second</li><li><b>D.</b> About 48 requests a second, the mean of the three</li></ul></li>
<li><p>A tuned small model is 3 points below a hosted larger model (interval −6 to 0). Its licence allows the use. The requests are Restricted and may not leave the organisation. Tuning removed a refusal behaviour; a replay adapter restores it at no measured cost.</p><ul><li><b>A.</b> Use the hosted model: it is better and cheaper</li><li><b>B.</b> Ship the tuned model as it is: 3 points is small</li><li><b>C.</b> Ship the replay adapter, gate releases on the refusal check, state the premium paid for placement</li><li><b>D.</b> Do not ship until it matches the larger model</li></ul></li>
<li><p>Systems A and B score 300 and 290 on the same 400 requests. Which additional fact decides whether A is better?</p><ul><li><b>A.</b> The score of a third system</li><li><b>B.</b> The average length of their answers, in tokens, on those requests</li><li><b>C.</b> How many requests each gets right that the other gets wrong</li><li><b>D.</b> The date each was evaluated</li></ul></li>
<li><p>A paired bootstrap on 400 requests resamples what, in each draw?</p><ul><li><b>A.</b> The outputs of each system separately, a thousand times each</li><li><b>B.</b> The requests, keeping both systems' results on each one together</li><li><b>C.</b> The tokens of each output</li><li><b>D.</b> The two systems</li></ul></li>
<li><p>The paired interval for "tuned minus base" is +52 to +61 points; for "tuned minus larger" it is −9 to −2 points. Which summary is supported?</p><ul><li><b>A.</b> Tuning worked; the larger model is still better here</li><li><b>B.</b> Tuning failed</li><li><b>C.</b> Nothing can be concluded</li><li><b>D.</b> Tuning worked, and the tuned model matches the larger one</li></ul></li>
<li><p>A tuned model is 4 points better than its alternative overall. In Arabic it is 3 points worse; in English 11 better. The service is used mostly in Arabic. What does the report lead with?</p><ul><li><b>A.</b> The English result, because it is the largest</li><li><b>B.</b> The average of the two slices</li><li><b>C.</b> The overall gain</li><li><b>D.</b> The Arabic result, with its interval</li></ul></li>
<li><p>"The base is frozen, so an adapter cannot make the model forget anything." What is wrong with this statement?</p><ul><li><b>A.</b> Forgetting only happens above rank 64</li><li><b>B.</b> Nothing: frozen weights cannot change</li><li><b>C.</b> The base weights are intact; base plus adapter behaves differently</li><li><b>D.</b> Adapters do change the base weights slightly, during each backward pass</li></ul></li>
<li><p>A tuning set of 600 examples maps every request to a tool call. After tuning, the model answers a request for a customer's phone number with a tool call instead of declining. What is the most direct cause?</p><ul><li><b>A.</b> The learning rate was too high</li><li><b>B.</b> The set never showed a refusal, so "always call a tool" is what it taught</li><li><b>C.</b> The base model never refused</li><li><b>D.</b> The test set leaked into training</li></ul></li>
<li><p>Which examples are suitable replay data for keeping a base model's refusal behaviour through tuning?</p><ul><li><b>A.</b> Refusal examples outside the check, mixed into the tuning set</li><li><b>B.</b> More task examples</li><li><b>C.</b> Examples from the test set</li><li><b>D.</b> The items of the refusal check itself, since they are already written</li></ul></li>
<li><p>When should the rule "which regression blocks a release" be written?</p><ul><li><b>A.</b> Only if a regression is found</li><li><b>B.</b> By the vendor of the base model</li><li><b>C.</b> After the tuned model's numbers are known, to fit them</li><li><b>D.</b> Before the numbers are known</li></ul></li>
<li><p>A general check of five tasks shows no regression after tuning. Which statement may the model card make?</p><ul><li><b>A.</b> "General abilities improved"</li><li><b>B.</b> "Tuning did not affect any of the other abilities"</li><li><b>C.</b> "No regression on the five tasks checked"</li><li><b>D.</b> "The model is safe"</li></ul></li>
<li><p>An organisation serves three tuned tasks. Each could be a fully fine-tuned copy of a 7-billion-parameter model, or one adapter on a shared base. What is the main saving of the adapter arrangement at serving time?</p><ul><li><b>A.</b> Each request needs fewer tokens</li><li><b>B.</b> One base in memory instead of three</li><li><b>C.</b> Adapters need no accelerator</li><li><b>D.</b> Adapters remove the need for evaluation</li></ul></li>
<li><p>In a load test, throughput rises from 20 to 55 requests a second as requests in flight go from 4 to 16. What explains the rise?</p><ul><li><b>A.</b> Requests that arrive together share each forward pass</li><li><b>B.</b> The adapters are cached after first use, so later requests skip them</li><li><b>C.</b> Latency falls as load rises</li><li><b>D.</b> The model gets faster as it warms up</li></ul></li>
<li><p>A service answers 50,000 requests a month with a p99 latency of 4 seconds. About how many requests take longer than 4 seconds?</p><ul><li><b>A.</b> 2,500</li><li><b>B.</b> 5,000</li><li><b>C.</b> 50</li><li><b>D.</b> 500</li></ul></li>
<li><p>A report states: "The server handles 70 requests per second." Which addition makes the figure usable for planning?</p><ul><li><b>A.</b> The date of the test</li><li><b>B.</b> The brand of the accelerator</li><li><b>C.</b> The latency percentile and target at that throughput, and the failure rate</li><li><b>D.</b> The number of adapters loaded</li></ul></li>
<li><p>A machine costs SAR 9,000 a month and can answer 2 million requests a month at its latency target. The service receives 60,000. What is the cost per thousand requests?</p><ul><li><b>A.</b> SAR 4.50</li><li><b>B.</b> SAR 150</li><li><b>C.</b> SAR 15</li><li><b>D.</b> SAR 0.15</li></ul></li>
<li><p>The cost per thousand requests on an owned machine is 300 times the cost at full capacity, because the machine is mostly idle. Which response addresses the cause?</p><ul><li><b>A.</b> Serve more tasks from the same base with additional adapters</li><li><b>B.</b> Lower the adapter rank</li><li><b>C.</b> Raise the latency target</li><li><b>D.</b> Quantise the model further, so that each answer takes less time</li></ul></li>
<li><p>Which sentence belongs in the limits section of a dataset card?</p><ul><li><b>A.</b> "All personal data has been removed, as confirmed by the automatic scan"</li><li><b>B.</b> "The dataset is unbiased"</li><li><b>C.</b> "The dataset is of high quality"</li><li><b>D.</b> "Accepted traces were not reviewed; an audit of 30 allows up to 11%"</li></ul></li>
<li><p>A decision memo recommends a tuned small model that scores below a hosted alternative and costs more per request. Which fact can still justify the recommendation?</p><ul><li><b>A.</b> Small models are the current trend</li><li><b>B.</b> The small model was more interesting to build and the team learnt more</li><li><b>C.</b> The data is classified so that it may not leave the organisation</li><li><b>D.</b> The team has already spent the budget</li></ul></li>
<li><p>Evaluation shows a tuned model is worse than a hosted larger model, the data is public, and the hosted model's terms allow the use. What should the memo recommend?</p><ul><li><b>A.</b> Ship the tuned model: the work is done</li><li><b>B.</b> Do not ship: use the hosted model, and say what would change the answer</li><li><b>C.</b> Ship both and let users choose</li><li><b>D.</b> Tune for another month</li></ul></li>
<li><p>A model card reports the task score and the training settings. Which section is most often left out and most needed by someone deciding whether to deploy?</p><ul><li><b>A.</b> What got worse after tuning</li><li><b>B.</b> The number of training steps</li><li><b>C.</b> The file size of the adapter</li><li><b>D.</b> The name of the base model</li></ul></li>
</ol>
